<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Confirm</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--mcp-ui-color-surface, #fff);
        --fg: var(--mcp-ui-color-text, #111);
        --muted: var(--mcp-ui-color-text-muted, #666);
        --border: var(--mcp-ui-color-border, #e2e2e2);
        --primary: var(--mcp-ui-color-primary, #1f6feb);
        --primary-fg: var(--mcp-ui-color-primary-foreground, #fff);
        --radius: 10px;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          Arial, sans-serif;
      }
      #root {
        padding: 16px;
        box-sizing: border-box;
        min-height: 100vh;
      }
      .muted {
        color: var(--muted);
        margin: 0;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        background: var(--bg);
      }
      .message {
        margin: 0 0 16px;
        white-space: pre-wrap;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .btn[disabled] {
        opacity: 0.6;
        cursor: progress;
      }
      .btn-primary {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }
      .btn-secondary:hover {
        background: var(--border);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
