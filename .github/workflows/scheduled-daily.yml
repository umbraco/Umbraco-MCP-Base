name: Scheduled — Daily CLI checks

# Runs daily to catch regressions that the PR suite can miss.
#
#   published-cli-smoke  — exercises the currently-published npm artifact
#                          (catches bundle bugs, missing `files`, broken deps).
#
#   cli-e2e              — full 19-step new-instance CLI E2E
#                          (scaffold → init's "create new" branch → Umbraco →
#                           discover → generate → compile → test → worker),
#                           plus the existing-instance E2E suite. Same as runs
#                           on PRs but scheduled so regressions in dev
#                           dependencies or transitive tooling surface without
#                           waiting for a PR.
#
#                          Runs as a matrix over Umbraco majors (17 LTS + 18) so
#                          both the legacy `swagger` and new `openapi` API-spec
#                          conventions are exercised end-to-end. The 18 leg pins
#                          the latest 18.x (incl. prerelease) and may fail on
#                          upstream RC churn — `fail-fast: false` keeps the 17
#                          leg independent. The existing-instance suite runs only
#                          on the 17 leg (its fixture is pinned to Umbraco 17).
#
# Failure notifications: relies on GitHub's built-in emails for scheduled
# workflows — the user who last modified this file receives an email when a
# scheduled run fails (if Actions notifications are enabled in their GitHub
# settings). No explicit notification job.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  published-cli-smoke:
    name: Scaffold from published npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Report published version
        id: version
        run: |
          LATEST=$(npm view @umbraco-cms/create-umbraco-mcp-server version)
          BETA=$(npm view @umbraco-cms/create-umbraco-mcp-server@beta version 2>/dev/null || echo "")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          echo "Latest dist-tag: $LATEST"
          echo "Beta dist-tag: $BETA"

      - name: Scaffold project via npx (latest dist-tag)
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes @umbraco-cms/create-umbraco-mcp-server@latest smoke-latest
          test -d smoke-latest
          test -f smoke-latest/package.json
          test -d smoke-latest/src

      - name: Verify CLI reports a version
        working-directory: ${{ runner.temp }}
        run: |
          VERSION=$(npx --yes @umbraco-cms/create-umbraco-mcp-server@latest --version)
          test -n "$VERSION"

      - name: Install dependencies in scaffolded project
        working-directory: ${{ runner.temp }}/smoke-latest
        run: npm install

      - name: Typecheck scaffolded project
        working-directory: ${{ runner.temp }}/smoke-latest
        run: npm run compile

      - name: Scaffold project via npx (beta dist-tag)
        if: steps.version.outputs.beta != ''
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes @umbraco-cms/create-umbraco-mcp-server@beta smoke-beta
          test -d smoke-beta
          test -f smoke-beta/package.json

      - name: Install dependencies in @beta scaffolded project
        if: steps.version.outputs.beta != ''
        working-directory: ${{ runner.temp }}/smoke-beta
        run: npm install

      - name: Typecheck @beta scaffolded project
        if: steps.version.outputs.beta != ''
        working-directory: ${{ runner.temp }}/smoke-beta
        run: npm run compile

  cli-e2e:
    name: E2E — Umbraco ${{ matrix.umbraco_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - umbraco_name: "17 (LTS)"
            major: 17
            prerelease_flag: ""
          - umbraco_name: "18"
            major: 18
            prerelease_flag: "--prerelease"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Moloko99
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Moloko99 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      TEST_SQL_CONNECTION_STRING: "Server=localhost,1433;User Id=sa;Password=Moloko99;TrustServerCertificate=True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET dev certs
        run: dotnet dev-certs https

      - name: Install PSW CLI
        run: dotnet tool install -g PackageScriptWriter.Cli --prerelease

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run build && npm run build -w packages/hosted-mcp && npm run build -w packages/create-mcp-server

      - name: Resolve latest Umbraco ${{ matrix.umbraco_name }} version
        id: umbraco_version
        run: |
          VER=$(npx tsx packages/create-mcp-server/scripts/resolve-umbraco-version.ts ${{ matrix.major }} ${{ matrix.prerelease_flag }})
          echo "Resolved Umbraco ${{ matrix.major }}.x → $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Run new-instance E2E tests (Umbraco ${{ matrix.umbraco_name }})
        env:
          TEST_UMBRACO_VERSION: ${{ steps.umbraco_version.outputs.version }}
        run: npm run test:e2e -w packages/create-mcp-server
        timeout-minutes: 20

      # The existing-instance fixture (tests/umbraco-instance) is pinned to
      # Umbraco 17, so only run it on the 17 leg.
      - name: Run existing-instance E2E tests
        if: matrix.major == 17
        run: npm run test:e2e:existing -w packages/create-mcp-server
        timeout-minutes: 10
