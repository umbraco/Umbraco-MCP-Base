trigger:
  branches:
    include:
    - main
    - dev
    - feature/*
    - release/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: nodeVersion
    value: '22.x'
  - name: sdkPackagePath
    value: 'packages/mcp-server-sdk'
  - name: hostedPackagePath
    value: 'packages/hosted-mcp'
  - name: cliPackagePath
    value: 'packages/create-mcp-server'
  # MyGet npm feed used for nightly / prerelease builds (Deploy_MyGet stage).
  # NEEDS HUMAN CONFIRMATION: this follows MyGet's standard npm endpoint shape
  # (https://www.myget.org/F/<feed>/npm/) but the feed name is a placeholder. A
  # human must confirm/create the feed and create the matching npm service
  # connection named "MyGet - Umbraco MCP" (feed URL + API key) in Azure DevOps
  # before Deploy_MyGet can publish — see CLAUDE.md "Nightly / pre-release
  # builds (MyGet)".
  - name: myGetNpmRegistry
    value: 'https://www.myget.org/F/umbraco-mcp/npm/'

stages:
- stage: BuildAndTest
  displayName: 'Build & Test'
  jobs:
  - job: BuildSDK
    displayName: 'Build SDK Package'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: 'node_modules'

    - script: npm ci
      displayName: 'Install dependencies'

    - script: npm run build
      displayName: 'Build TypeScript'

    - script: npm run test
      displayName: 'Run tests'

    - task: PublishTestResults@2
      displayName: 'Publish SDK test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(sdkPackagePath)/junit.xml'
        testRunTitle: 'SDK Tests'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: false

    - script: npm pack --pack-destination $(Build.ArtifactStagingDirectory)
      displayName: 'Create NPM package'
      workingDirectory: $(sdkPackagePath)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish SDK package to artifacts'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'sdk-package'

  - job: BuildHosted
    displayName: 'Build Hosted MCP Package'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: 'node_modules'

    - script: npm ci
      displayName: 'Install dependencies'

    - script: npm run build
      displayName: 'Build SDK (workspace dependency)'

    - script: npm run build -w $(hostedPackagePath)
      displayName: 'Build Hosted MCP'

    - script: npm test -w $(hostedPackagePath)
      displayName: 'Run Hosted MCP tests'

    - task: PublishTestResults@2
      displayName: 'Publish Hosted MCP test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(hostedPackagePath)/junit.xml'
        testRunTitle: 'Hosted MCP Tests'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: false

    - script: npm pack --pack-destination $(Build.ArtifactStagingDirectory)
      displayName: 'Create NPM package'
      workingDirectory: $(hostedPackagePath)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Hosted MCP package to artifacts'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'hosted-package'

  - job: BuildCLI
    displayName: 'Build CLI Package'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: 'node_modules'

    - script: npm ci
      displayName: 'Install dependencies'

    - script: npm run build
      displayName: 'Build SDK (workspace dependency)'

    - script: npm run build -w $(cliPackagePath)
      displayName: 'Build CLI'

    - script: npm test -w $(cliPackagePath)
      displayName: 'Run CLI tests'

    - task: PublishTestResults@2
      displayName: 'Publish CLI test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(cliPackagePath)/junit.xml'
        testRunTitle: 'CLI Tests'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: false

    - script: npm pack --pack-destination $(Build.ArtifactStagingDirectory)
      displayName: 'Create NPM package'
      workingDirectory: $(cliPackagePath)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish CLI package to artifacts'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'cli-package'

- stage: Deploy_Npm
  displayName: 'NPM release'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  dependsOn:
    - BuildAndTest
  jobs:
    - job: PublishSDK
      displayName: Publish SDK to NPM
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'sdk-package'
        - bash: echo "@umbraco-cms:registry=https://registry.npmjs.org" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/sdk-package
          displayName: Add scoped registry to .npmrc
        - task: npmAuthenticate@0
          displayName: Authenticate with npm
          inputs:
            workingFile: $(Pipeline.Workspace)/sdk-package/.npmrc
            customEndpoint: "NPM - Umbraco Backoffice"
        - script: |
            npm init -y
            tgz=(*.tgz)
            tar -xf "${tgz[0]}" --strip-components=1 package/package.json
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")

            if npm view "${name}@${version}" version 2>/dev/null; then
              echo "##[warning]Skipping ${name}@${version} — already published"
              exit 0
            fi

            if [[ "$version" == *"alpha"* ]]; then tag="alpha"
            elif [[ "$version" == *"beta"* ]]; then tag="beta"
            elif [[ "$version" == *"rc"* ]]; then tag="rc"
            else tag="latest"
            fi

            echo "Publishing ${name}@${version} with tag ${tag}"
            npm publish "${tgz[0]}" --tag "$tag" --access public

            # Also set latest if no stable version exists yet
            if [[ "$tag" != "latest" ]]; then
              latest=$(npm view "$name" dist-tags.latest 2>/dev/null || echo "")
              if [[ -z "$latest" || "$latest" == *"-"* ]]; then
                echo "No stable release found (latest=${latest:-none}), also tagging as latest"
                npm dist-tag add "${name}@${version}" latest
              fi
            fi
          displayName: Publish SDK to npm
          workingDirectory: $(Pipeline.Workspace)/sdk-package

    - job: PublishHosted
      displayName: Publish Hosted MCP to NPM
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'hosted-package'
        - bash: echo "@umbraco-cms:registry=https://registry.npmjs.org" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/hosted-package
          displayName: Add scoped registry to .npmrc
        - task: npmAuthenticate@0
          displayName: Authenticate with npm
          inputs:
            workingFile: $(Pipeline.Workspace)/hosted-package/.npmrc
            customEndpoint: "NPM - Umbraco Backoffice"
        - script: |
            npm init -y
            tgz=(*.tgz)
            tar -xf "${tgz[0]}" --strip-components=1 package/package.json
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")

            if npm view "${name}@${version}" version 2>/dev/null; then
              echo "##[warning]Skipping ${name}@${version} — already published"
              exit 0
            fi

            if [[ "$version" == *"alpha"* ]]; then tag="alpha"
            elif [[ "$version" == *"beta"* ]]; then tag="beta"
            elif [[ "$version" == *"rc"* ]]; then tag="rc"
            else tag="latest"
            fi

            echo "Publishing ${name}@${version} with tag ${tag}"
            npm publish "${tgz[0]}" --tag "$tag" --access public

            # Also set latest if no stable version exists yet
            if [[ "$tag" != "latest" ]]; then
              latest=$(npm view "$name" dist-tags.latest 2>/dev/null || echo "")
              if [[ -z "$latest" || "$latest" == *"-"* ]]; then
                echo "No stable release found (latest=${latest:-none}), also tagging as latest"
                npm dist-tag add "${name}@${version}" latest
              fi
            fi
          displayName: Publish Hosted MCP to npm
          workingDirectory: $(Pipeline.Workspace)/hosted-package

    - job: PublishCLI
      displayName: Publish CLI to NPM
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'cli-package'
        - bash: echo "@umbraco-cms:registry=https://registry.npmjs.org" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/cli-package
          displayName: Add scoped registry to .npmrc
        - task: npmAuthenticate@0
          displayName: Authenticate with npm
          inputs:
            workingFile: $(Pipeline.Workspace)/cli-package/.npmrc
            customEndpoint: "NPM - Umbraco Backoffice"
        - script: |
            npm init -y
            tgz=(*.tgz)
            tar -xf "${tgz[0]}" --strip-components=1 package/package.json
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")

            if npm view "${name}@${version}" version 2>/dev/null; then
              echo "##[warning]Skipping ${name}@${version} — already published"
              exit 0
            fi

            if [[ "$version" == *"alpha"* ]]; then tag="alpha"
            elif [[ "$version" == *"beta"* ]]; then tag="beta"
            elif [[ "$version" == *"rc"* ]]; then tag="rc"
            else tag="latest"
            fi

            echo "Publishing ${name}@${version} with tag ${tag}"
            npm publish "${tgz[0]}" --tag "$tag" --access public

            # Also set latest if no stable version exists yet
            if [[ "$tag" != "latest" ]]; then
              latest=$(npm view "$name" dist-tags.latest 2>/dev/null || echo "")
              if [[ -z "$latest" || "$latest" == *"-"* ]]; then
                echo "No stable release found (latest=${latest:-none}), also tagging as latest"
                npm dist-tag add "${name}@${version}" latest
              fi
            fi
          displayName: Publish CLI to npm
          workingDirectory: $(Pipeline.Workspace)/cli-package

# The git tag + GitHub Release are created automatically by the
# .github/workflows/release-tag.yml GitHub Actions workflow, which triggers on
# push to main (i.e. when this release merge lands). It is independent of this
# npm publish — see CLAUDE.md "Post-release: tag the release (automated)".

# Nightly / prerelease builds. Publishes the same artifacts BuildAndTest already
# produced to the MyGet npm feed so changes can be tested before a release is
# cut: nightlies on every push to dev, prereleases on release/* branches. main
# is deliberately excluded — Deploy_Npm owns real releases on the public npm
# registry. Versions get a unique -nightly.<UTC date>.<build id> suffix and the
# "nightly" dist-tag, so this never collides with npm latest/alpha/beta/rc.
- stage: Deploy_MyGet
  displayName: 'MyGet nightly / prerelease'
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/dev'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))
  dependsOn:
    - BuildAndTest
  jobs:
    - job: PublishSDKNightly
      displayName: Publish SDK nightly to MyGet
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'sdk-package'
        - bash: echo "@umbraco-cms:registry=$(myGetNpmRegistry)" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/sdk-package
          displayName: Add scoped MyGet registry to .npmrc
        - task: npmAuthenticate@0
          displayName: Authenticate with MyGet
          inputs:
            workingFile: $(Pipeline.Workspace)/sdk-package/.npmrc
            customEndpoint: "MyGet - Umbraco MCP"
        - bash: bash "$(Build.SourcesDirectory)/scripts/publish-nightly.sh" "$(Pipeline.Workspace)/sdk-package" "$(Build.BuildId)"
          displayName: Publish SDK nightly to MyGet

    - job: PublishHostedNightly
      displayName: Publish Hosted MCP nightly to MyGet
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'hosted-package'
        - bash: echo "@umbraco-cms:registry=$(myGetNpmRegistry)" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/hosted-package
          displayName: Add scoped MyGet registry to .npmrc
        - task: npmAuthenticate@0
          displayName: Authenticate with MyGet
          inputs:
            workingFile: $(Pipeline.Workspace)/hosted-package/.npmrc
            customEndpoint: "MyGet - Umbraco MCP"
        - bash: bash "$(Build.SourcesDirectory)/scripts/publish-nightly.sh" "$(Pipeline.Workspace)/hosted-package" "$(Build.BuildId)"
          displayName: Publish Hosted MCP nightly to MyGet

    - job: PublishCLINightly
      displayName: Publish CLI nightly to MyGet
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'cli-package'
        - bash: echo "@umbraco-cms:registry=$(myGetNpmRegistry)" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/cli-package
          displayName: Add scoped MyGet registry to .npmrc
        - task: npmAuthenticate@0
          displayName: Authenticate with MyGet
          inputs:
            workingFile: $(Pipeline.Workspace)/cli-package/.npmrc
            customEndpoint: "MyGet - Umbraco MCP"
        - bash: bash "$(Build.SourcesDirectory)/scripts/publish-nightly.sh" "$(Pipeline.Workspace)/cli-package" "$(Build.BuildId)"
          displayName: Publish CLI nightly to MyGet
