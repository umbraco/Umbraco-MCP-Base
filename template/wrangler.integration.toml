# Wrangler config for integration tests.
# Uses a fixed port and test-specific KV/DO bindings.
# Secrets loaded from .dev.vars.integration.

name = "my-umbraco-mcp-test"
main = "src/worker.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "integration-test-kv"

[durable_objects]
bindings = [
  { name = "MCP_AGENT", class_name = "UmbracoMcpAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UmbracoMcpAgent"]
