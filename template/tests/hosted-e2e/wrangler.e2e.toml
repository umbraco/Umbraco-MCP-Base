# Wrangler config for E2E tests.
# Uses a fixed port and test-specific KV/DO bindings.

name = "my-umbraco-mcp-e2e"
main = "../../src/worker.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "e2e-test-kv"

[durable_objects]
bindings = [
  { name = "MCP_AGENT", class_name = "UmbracoMcpAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UmbracoMcpAgent"]
